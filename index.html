<script id="numero-self-refresh-cache-guard">
(function(){
  'use strict';

  var BUILD_KEY = 'numero_support_build_version';
  var VERSION_FILE = 'build-version.txt';

  function forceFreshHtml(serverBuild){
    try {
      var current = new URL(window.location.href);
      if (current.searchParams.get('__build') === serverBuild) return;
      current.searchParams.set('__build', serverBuild);
      current.searchParams.set('__fresh', String(Date.now()));
      window.location.replace(current.toString());
    } catch(e) {
      var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
      window.location.replace(window.location.href + sep + '__build=' +
        encodeURIComponent(serverBuild) + '&__fresh=' + Date.now());
    }
  }

  function checkBuild(){
    fetch(VERSION_FILE + '?t=' + Date.now(), {
      cache: 'no-store',
      headers: {'Cache-Control':'no-cache'}
    })
    .then(function(r){
      if(!r.ok) throw new Error('version fetch failed');
      return r.text();
    })
    .then(function(v){
      var serverBuild = String(v || '').trim();
      if(!serverBuild) return;

      var stored = '';
      try { stored = localStorage.getItem(BUILD_KEY) || ''; } catch(e) {}

      if(stored !== serverBuild){
        try { localStorage.setItem(BUILD_KEY, serverBuild); } catch(e) {}
        forceFreshHtml(serverBuild);
      }
    })
    .catch(function(){});
  }

  checkBuild();
})();
</script>

  <script>

    (function() {

      'use strict';


    /* =========================
       PRESENTATION TIMER ENGINE
    ========================== */

    let presentationPaused = false;
    const presentationTimers = new Set();

    function presentationTimer(callback, delay) {
      const timer = {
        callback: callback,
        remaining: delay,
        startedAt: Date.now(),
        timeoutId: null
      };

      timer.run = function() {
        timer.startedAt = Date.now();
        timer.timeoutId = window.setTimeout(function() {
          presentationTimers.delete(timer);
          timer.callback();
        }, timer.remaining);
      };

      presentationTimers.add(timer);

      if (!presentationPaused) {
        timer.run();
      }

      return timer;
    }

    function pausePresentation() {
      if (presentationPaused) return;
      presentationPaused = true;
      document.body.classList.add('presentation-paused');

      presentationTimers.forEach(function(timer) {
        if (timer.timeoutId !== null) {
          window.clearTimeout(timer.timeoutId);
          const elapsed = Date.now() - timer.startedAt;
          timer.remaining = Math.max(0, timer.remaining - elapsed);
          timer.timeoutId = null;
        }
      });

      document.getElementById('presentationControlIcon').textContent = '▶';
      document.getElementById('presentationControlText').textContent = 'PLAY';
      document.getElementById('presentationControl').setAttribute('aria-label','Resume presentation');
    }

    function resumePresentation() {
      if (!presentationPaused) return;
      presentationPaused = false;
      document.body.classList.remove('presentation-paused');

      presentationTimers.forEach(function(timer) {
        if (timer.timeoutId === null) {
          timer.run();
        }
      });

      document.getElementById('presentationControlIcon').textContent = '⏸';
      document.getElementById('presentationControlText').textContent = 'PAUSE';
      document.getElementById('presentationControl').setAttribute('aria-label','Pause presentation');
    }

    document.getElementById('presentationControl').addEventListener('click', function() {
      if (presentationPaused) {
        resumePresentation();
      } else {
        pausePresentation();
      }
    });


    function loadStageTwo() {

      const cover =
        document.getElementById(
          'transitionCover'
        );

      cover.classList.add('active');

      presentationTimer(function() {

        google.script.run

          .withSuccessHandler(function(html) {

            document.open();
            document.write(html);
            document.close();

          })

          .withFailureHandler(function(error) {

            console.error(
              'Stage 2 load failed:',
              error
            );

          })

          .getPage('index1');

      }, 750);
    }


    /* Door and overview content are intentionally fixed in this file.
       Google Sheets / getContent() must not overwrite them. */

    /* =========================
       TIMELINE

       0 - 5 sec
       قراءة اللوحة

       5 sec
       فتح الباب

       7.8 sec تقريباً
       انتقال للمرحلة الثانية
    ========================== */

    presentationTimer(function() {

      document
        .getElementById('doorFrame')
        .classList
        .add('open');

      document
        .getElementById('scene')
        .classList
        .add('opening');

      presentationTimer(function() {
        loadStageTwo();
      }, 2800);

    }, 5000);


    })();

  </script>
<script id="final-pause-toggle-4-pages">
(function(){
  'use strict';

  function control(){ return document.getElementById('presentationControl'); }
  function icon(){ return document.getElementById('presentationControlIcon'); }
  function text(){ return document.getElementById('presentationControlText'); }

  function setIconFromPausedState(){
    var c=control(), i=icon(), t=text();
    if(!c) return;

    if(t) t.style.display='none';

    var paused=document.body.classList.contains('presentation-paused');
    var symbol=paused ? '▶' : '⏸';

    if(i) i.textContent=symbol;
    else c.textContent=symbol;

    c.setAttribute('aria-label', paused ? 'Play presentation' : 'Pause presentation');
    c.title=paused ? 'Play' : 'Pause';
  }

  function install(){
    var c=control();
    if(!c || c.getAttribute('data-final-pause-sync')==='1') return;

    c.setAttribute('data-final-pause-sync','1');
    setIconFromPausedState();

    c.addEventListener('click',function(){
      setTimeout(setIconFromPausedState,0);
      setTimeout(setIconFromPausedState,40);
    },false);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',install,{once:true});
  }else{
    install();
  }

  setTimeout(install,100);
  setTimeout(install,500);
})();
</script>

<script id="numero-controls-final-v6-script">
(function(){
  'use strict';
  var AR_IDS=['arabicToggle','arBtn','tourArabicToggle'];
  var VOICE_IDS=['voiceToggle','voiceBtn','tourVoiceToggle'];
  var PAUSE_IDS=['pauseBtn','pauseToggle','tourPauseToggle'];
  var busy=false, queued=false;

  function get(ids){
    for(var i=0;i<ids.length;i++){
      var el=document.getElementById(ids[i]);
      if(el) return el;
    }
    return null;
  }
  function stored(key,fallback){
    try{
      var v=localStorage.getItem(key);
      if(v===null) return fallback;
      return v!=='0';
    }catch(e){ return fallback; }
  }
  function parseOnOff(text){
    var t=String(text||'').toUpperCase();
    if(/\b(?:VOICE\s+)?OFF\b/.test(t)) return false;
    if(/\b(?:VOICE\s+)?ON\b/.test(t)) return true;
    if(/\bAR\s+OFF\b/.test(t)) return false;
    if(/\bAR\s+ON\b/.test(t)) return true;
    return null;
  }
  function makeGlyph(text,kind){
    var s=document.createElement('span');
    s.className='numero-control-glyph '+kind;
    s.setAttribute('aria-hidden','true');
    s.textContent=text;
    return s;
  }
  function setGlyph(btn,text,kind){
    if(!btn) return;
    var child=btn.firstElementChild;
    if(btn.childElementCount===1 && child && child.classList.contains('numero-control-glyph') && child.textContent===text && child.classList.contains(kind)) return;
    btn.replaceChildren(makeGlyph(text,kind));
  }
  function syncArabic(){
    var b=get(AR_IDS); if(!b) return;
    var nativeText=(b.textContent||'').trim();
    var parsed=parseOnOff(nativeText);
    if(parsed!==null) b.dataset.numeroArState=parsed?'1':'0';
    var on=b.dataset.numeroArState ? b.dataset.numeroArState==='1' :
      (b.classList.contains('active')||b.classList.contains('on') ? true : stored('support_center_ar',true));
    b.dataset.numeroArState=on?'1':'0';
    setGlyph(b,'AR','ar');
    b.title=on?'Arabic translation: ON':'Arabic translation: OFF';
    b.setAttribute('aria-label',b.title);
  }
  function syncVoice(){
    var b=get(VOICE_IDS); if(!b) return;
    var nativeText=(b.textContent||'').trim();
    var parsed=parseOnOff(nativeText);
    if(parsed!==null) b.dataset.numeroVoiceState=parsed?'1':'0';
    if(/N\/A/i.test(nativeText)) b.dataset.numeroVoiceState='na';
    var state=b.dataset.numeroVoiceState;
    if(!state){
      if(b.classList.contains('off')) state='0';
      else if(b.classList.contains('active')||b.classList.contains('on')) state='1';
      else state=stored('support_center_voice',true)?'1':'0';
      b.dataset.numeroVoiceState=state;
    }
    var unavailable=state==='na';
    var on=state==='1';
    setGlyph(b,unavailable?'—':(on?'🔊':'🔇'),'voice');
    b.title=unavailable?'Audio unavailable':(on?'Audio on':'Audio muted');
    b.setAttribute('aria-label',b.title);
  }
  function syncPause(){
    var b=get(PAUSE_IDS); if(!b) return;
    var raw=((b.getAttribute('aria-label')||'')+' '+(b.textContent||'')).toUpperCase();
    var action=b.dataset.numeroPauseAction||'';
    if(/REPLAY|RESTART|↻/.test(raw)) action='replay';
    else if(/\bPLAY\b|RESUME|▶/.test(raw)) action='play';
    else if(/PAUSE|⏸/.test(raw)) action='pause';
    if(!action) action='pause';
    b.dataset.numeroPauseAction=action;
    var icon=action==='play'?'▶':(action==='replay'?'↻':'⏸');
    setGlyph(b,icon,'pause');
    b.title=action==='play'?'Play':(action==='replay'?'Replay':'Pause');
    b.setAttribute('aria-label',b.title);
  }
  function syncIndex2Shells(){
    var lang=document.getElementById('languageControl');
    var sound=document.getElementById('soundControl');
    if(lang){lang.style.setProperty('transform','none','important');lang.style.setProperty('transition','none','important');}
    if(sound){sound.style.setProperty('transform','none','important');sound.style.setProperty('transition','none','important');}
  }
  function syncAll(){
    if(busy) return;
    busy=true;
    try{ syncArabic(); syncVoice(); syncPause(); syncIndex2Shells(); }
    finally{ busy=false; }
  }
  function queue(){
    if(queued) return;
    queued=true;
    Promise.resolve().then(function(){queued=false;syncAll();});
  }
  function install(){
    syncAll();
    var obs=new MutationObserver(function(mutations){
      if(busy) return;
      for(var i=0;i<mutations.length;i++){
        var t=mutations[i].target;
        if(t && t.nodeType===3) t=t.parentElement;
        if(!t) continue;
        var btn=(t.tagName==='BUTTON')?t:(t.closest?t.closest('button'):null);
        if(!btn) continue;
        var id=btn.id||'';
        if(AR_IDS.indexOf(id)>=0 || VOICE_IDS.indexOf(id)>=0 || PAUSE_IDS.indexOf(id)>=0 || id==='languageControl' || id==='soundControl'){
          queue(); return;
        }
      }
    });
    if(document.body) obs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','aria-label']});
    document.addEventListener('click',function(e){
      var b=e.target&&e.target.closest?e.target.closest('button'):null;
      if(!b) return;
      var id=b.id||'';
      if(AR_IDS.indexOf(id)>=0 || VOICE_IDS.indexOf(id)>=0 || PAUSE_IDS.indexOf(id)>=0 || id==='languageControl' || id==='soundControl'){
        setTimeout(syncAll,0); setTimeout(syncAll,60); setTimeout(syncAll,180);
      }
    },false);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true});
  else install();
})();
</script>
