<script id="numero-self-refresh-cache-guard">
(function(){
  'use strict';

  var BUILD_KEY = 'numero_support_build_version';
  var VERSION_FILE = 'build-version.txt';

  function forceFreshHtml(serverBuild){
    try {
      var current = new URL(window.location.href);
      if (current.searchParams.get('__build') === serverBuild) return;
      current.searchParams.set('__build', serverBuild);
      current.searchParams.set('__fresh', String(Date.now()));
      window.location.replace(current.toString());
    } catch(e) {
      var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
      window.location.replace(window.location.href + sep + '__build=' +
        encodeURIComponent(serverBuild) + '&__fresh=' + Date.now());
    }
  }

  function checkBuild(){
    fetch(VERSION_FILE + '?t=' + Date.now(), {
      cache: 'no-store',
      headers: {'Cache-Control':'no-cache'}
    })
    .then(function(r){
      if(!r.ok) throw new Error('version fetch failed');
      return r.text();
    })
    .then(function(v){
      var serverBuild = String(v || '').trim();
      if(!serverBuild) return;

      var stored = '';
      try { stored = localStorage.getItem(BUILD_KEY) || ''; } catch(e) {}

      if(stored !== serverBuild){
        try { localStorage.setItem(BUILD_KEY, serverBuild); } catch(e) {}
        forceFreshHtml(serverBuild);
      }
    })
    .catch(function(){});
  }

  checkBuild();
})();
</script>

<script>
(function(){
  const AR_KEY='support_center_ar';
  const VOICE_KEY='support_center_voice';

  const scenes={
    discussion:'scene0',
    thanks:'scene1',
    farewell:'scene2'
  };

  const sceneMeta={
    discussion:{tag:'CLOSING DIALOGUE',title:'A strong visit. A clear impression.',subtitle:'Final dialogue · appreciation · a confident farewell'},
    thanks:{tag:'VISITOR FEEDBACK',title:'The visit ends with appreciation.',subtitle:'The guests share their impression of the department'},
    farewell:{tag:'HAPPY FAREWELL',title:'A warm goodbye from the Support Center.',subtitle:'Guests leave with a positive impression of the full team'}
  };

  const steps=[
    {
      speaker:'visitor',
      scene:'discussion',
      en:'Thank you. This visit gave us a clear picture of how the Customer Support Center is managed, measured, and continuously improved.',
      ar:'شكرًا لكم. هذه الزيارة أعطتنا صورة واضحة عن كيفية إدارة مركز دعم العملاء وقياسه وتحسينه بشكل مستمر.'
    },
    {
      speaker:'support_manager',
      scene:'discussion',
      en:'We appreciate your visit. Our goal is to keep support structured, accountable, and connected to the wider organization through clear follow-up and measurable results.',
      ar:'نحن نقدّر زيارتكم. هدفنا أن يبقى الدعم منظمًا ومسؤولًا ومرتبطًا بالمؤسسة عبر متابعة واضحة ونتائج قابلة للقياس.'
    },
    {
      speaker:'assistant_head',
      scene:'discussion',
      en:'From plans and systems to reports and coordination, we try to turn daily support work into stable operations and practical improvement.',
      ar:'من الخطط والأنظمة إلى التقارير والتنسيق، نحاول تحويل العمل اليومي في الدعم إلى تشغيل مستقر وتحسين عملي.'
    },
    {
      speaker:'quality_manager',
      scene:'discussion',
      en:'And from the quality side, we keep reviewing performance, identifying gaps, and supporting the teams so the customer experience keeps getting better.',
      ar:'ومن جانب الجودة، نستمر في مراجعة الأداء وتحديد الفجوات ودعم الفرق حتى تستمر تجربة العميل بالتحسن.'
    },
    {
      speaker:'visitor',
      scene:'thanks',
      en:'Honestly, the structure is clear, the roles are well connected, and the effort of the full team is very visible. It leaves a strong and professional impression.',
      ar:'بصراحة، الهيكل واضح، والأدوار مترابطة، وجهد الفريق بالكامل ظاهر جدًا. وهذا يترك انطباعًا قويًا واحترافيًا.'
    },
    {
      speaker:'support_manager',
      scene:'thanks',
      en:'That means a lot to us. Please share any note or suggestion. We always welcome feedback that helps us improve further.',
      ar:'هذا يعني لنا الكثير. نرحب بأي ملاحظة أو اقتراح، فملاحظاتكم تساعدنا دائمًا على التطوير بشكل أفضل.'
    },
    {
      speaker:'visitor',
      scene:'farewell',
      en:'Thank you again. We are leaving with a very positive impression of the Customer Support Center, its leadership, and the teams behind it.',
      ar:'شكرًا لكم مرة أخرى. نغادر بانطباع إيجابي جدًا عن مركز دعم العملاء وقيادته والفرق التي تقف خلفه.'
    },
    {
      speaker:'assistant_head',
      scene:'farewell',
      en:'You are always welcome. It was a pleasure to host you, and we hope the visit reflected the spirit of this department and the people behind it.',
      ar:'أهلًا وسهلًا بكم دائمًا. كان من دواعي سرورنا استضافتكم، ونأمل أن تكون الزيارة قد عكست روح هذا القسم والناس الذين يقفون خلفه.'
    }
  ];

  const state={index:0,arabic:false,voice:true,paused:false,ended:false,timer:null,token:0,currentUtterance:null,voices:[],profiles:[]};
  const els={
    arBtn:document.getElementById('arBtn'),
    voiceBtn:document.getElementById('voiceBtn'),
    pauseBtn:document.getElementById('pauseBtn'),
    progress:document.getElementById('progressBar'),
    dialogue:document.getElementById('dialogue'),
    dialogueName:document.getElementById('dialogueName'),
    dialogueEn:document.getElementById('dialogueEn'),
    dialogueAr:document.getElementById('dialogueAr'),
    pageTitle:document.getElementById('pageTitle'),
    pageSubtitle:document.getElementById('pageSubtitle'),
    sceneTag:document.getElementById('sceneTag'),
    endActions:document.getElementById('endActions'),
    replayBtn:document.getElementById('replayBtn'),
    restartBtn:document.getElementById('restartBtn')
  };

  function safeGet(k,f){try{const v=localStorage.getItem(k);return v===null?f:v}catch(e){return f}}
  function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  state.arabic=safeGet(AR_KEY,'1')==='1';
  state.voice=safeGet(VOICE_KEY,'1')!=='0';

  function clearTimer(){if(state.timer){clearTimeout(state.timer);state.timer=null}}
  function loadVoices(){if('speechSynthesis' in window) state.voices=window.speechSynthesis.getVoices()||[]}
  loadVoices(); if('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged=loadVoices;

  function stopVoice(){
    if('speechSynthesis' in window){
      try{window.speechSynthesis.cancel();}catch(e){}
    }
    state.currentUtterance=null;
  }

  function speakerTitle(key){
    if(String(key||'').toLowerCase()==='support_manager') return 'HEAD OF CUSTOMER SUPPORT CENTER';
    const found=state.profiles.find(p=>String(p.speaker_key||'').toLowerCase()===String(key||'').toLowerCase());
    if(found&&found.title) return String(found.title).toUpperCase();
    const map={
      visitor:'VISITOR',
      support_manager:'HEAD OF CUSTOMER SUPPORT CENTER',
      assistant_head:'ASSISTANT HEAD OF CUSTOMER SUPPORT CENTER',
      quality_manager:'QUALITY MANAGER'
    };
    return map[key]||String(key||'SYSTEM').replaceAll('_',' ').toUpperCase();
  }

  function profileFor(key){
    const found=state.profiles.find(p=>String(p.speaker_key||'').toLowerCase()===String(key||'').toLowerCase());
    if(found) return found;
    return {speaker_key:key,lang:'en-US',voice_hint:'',rate:.92,pitch:1};
  }

  function chooseVoice(profile){
    const voices=state.voices.length?state.voices:(window.speechSynthesis?window.speechSynthesis.getVoices():[]);
    if(!voices.length) return null;
    const hint=String(profile.voice_hint||'').toLowerCase();
    if(hint){
      const exact=voices.find(v=>String(v.name||'').toLowerCase().includes(hint));
      if(exact) return exact;
    }
    const base=String(profile.lang||'en-US').toLowerCase().split('-')[0];
    const pool=voices.filter(v=>String(v.lang||'').toLowerCase().startsWith(base));
    const set=pool.length?pool:voices;
    const idx=Math.abs(String(profile.speaker_key||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0))%(set.length||1);
    return set[idx]||voices[0];
  }

  function estimateDuration(text){
    return Math.max(4200,Math.min(12500,String(text||'').length*57+2200));
  }

  function schedule(ms,token){
    clearTimer();
    state.timer=setTimeout(()=>{
      if(!state.paused && token===state.token) next();
    },ms);
  }

  function renderScene(step){
    Object.values(scenes).forEach(id=>document.getElementById(id).classList.remove('active'));
    const imgId=scenes[step.scene]||scenes.discussion;
    document.getElementById(imgId).classList.add('active');
    document.querySelector('.page').classList.toggle('final-farewell',step.scene==='farewell');
    const meta=sceneMeta[step.scene]||sceneMeta.discussion;
    els.pageTitle.textContent=meta.title;
    els.pageSubtitle.textContent=meta.subtitle;
    els.sceneTag.textContent=meta.tag;
  }

  function renderDialogue(step){
    els.dialogue.className='dialogue'+(step.speaker==='visitor'?' visitor':'');
    els.dialogue.classList.remove('show');
    setTimeout(()=>{
      els.dialogueName.textContent=speakerTitle(step.speaker);
      els.dialogueEn.textContent=step.en||'';
      els.dialogueAr.textContent=step.ar||'';
      els.dialogueAr.classList.toggle('on',state.arabic);
      els.dialogue.classList.add('show');
    },70);
  }

  function updateControls(){
    els.arBtn.textContent=state.arabic?'AR ON':'AR OFF';
    els.arBtn.classList.toggle('on',state.arabic);
    els.voiceBtn.textContent=state.voice?'VOICE ON':'VOICE OFF';
    els.voiceBtn.classList.toggle('on',state.voice);
    els.pauseBtn.textContent=state.ended?'REPLAY':(state.paused?'PLAY':'PAUSE');
  }

  function speak(step,token){
    if(!state.voice || state.paused || !('speechSynthesis' in window)){
      schedule(estimateDuration(step.en),token);
      return;
    }

    stopVoice();
    const profile=profileFor(step.speaker);
    const u=new SpeechSynthesisUtterance(step.en||'');
    u.lang=profile.lang||'en-US';
    u.rate=Math.min(.96,Number(profile.rate||.92));
    u.pitch=Number(profile.pitch||1);
    const voice=chooseVoice(profile);
    if(voice){u.voice=voice;u.lang=voice.lang||u.lang}
    state.currentUtterance=u;

    u.onend=()=>{
      if(state.currentUtterance===u) state.currentUtterance=null;
      if(!state.paused && token===state.token) schedule(900,token);
    };
    u.onerror=()=>{
      if(state.currentUtterance===u) state.currentUtterance=null;
      if(!state.paused && token===state.token) schedule(estimateDuration(step.en),token);
    };

    try{window.speechSynthesis.speak(u)}catch(e){state.currentUtterance=null;schedule(estimateDuration(step.en),token)}
  }

  function render(){
    const step=steps[state.index];
    clearTimer();
    stopVoice();
    state.token+=1;
    const token=state.token;
    state.ended=false;
    els.endActions.classList.remove('show');
    renderScene(step);
    renderDialogue(step);
    els.progress.style.width=(((state.index+1)/steps.length)*100).toFixed(2)+'%';
    updateControls();
    if(!state.paused) speak(step,token);
  }

  function finish(){
    state.ended=true;
    state.paused=true;
    clearTimer();
    stopVoice();
    els.endActions.classList.add('show');
    updateControls();
  }

  function next(){
    if(state.index<steps.length-1){
      state.index+=1;
      render();
    }else{
      finish();
    }
  }

  function openIndex(file){
    clearTimer();
    stopVoice();
    if(typeof google!=='undefined' && google.script && google.script.run){
      google.script.run
        .withSuccessHandler(html=>{document.open();document.write(html);document.close();})
        .withFailureHandler(err=>console.error('Navigation failed',err))
        .getPage(file);
    }
  }

  els.arBtn.addEventListener('click',()=>{
    state.arabic=!state.arabic;
    safeSet(AR_KEY,state.arabic?'1':'0');
    els.dialogueAr.classList.toggle('on',state.arabic);
    updateControls();
  });

  els.voiceBtn.addEventListener('click',()=>{
    state.voice=!state.voice;
    safeSet(VOICE_KEY,state.voice?'1':'0');
    if(!state.voice){
      stopVoice();
      state.token+=1;
      if(!state.paused && !state.ended) schedule(estimateDuration(steps[state.index].en),state.token);
    }else if(!state.paused && !state.ended){
      render();
    }
    updateControls();
  });

  els.pauseBtn.addEventListener('click',()=>{
    if(state.ended){
      state.ended=false;
      state.paused=false;
      state.index=0;
      render();
      return;
    }

    state.paused=!state.paused;
    if(state.paused){
      clearTimer();
      if('speechSynthesis' in window && state.currentUtterance){try{window.speechSynthesis.pause();}catch(e){}}
    }else{
      if('speechSynthesis' in window && state.currentUtterance){try{window.speechSynthesis.resume();}catch(e){}}
      else render();
    }
    updateControls();
  });

  els.replayBtn.addEventListener('click',()=>{
    state.ended=false;
    state.paused=false;
    state.index=0;
    render();
  });

  els.restartBtn.addEventListener('click',()=>openIndex('index'));

  window.addEventListener('beforeunload',stopVoice);

  if(typeof google!=='undefined' && google.script && google.script.run){
    google.script.run
      .withSuccessHandler(profiles=>{state.profiles=Array.isArray(profiles)?profiles:[];render();})
      .withFailureHandler(()=>{state.profiles=[];render();})
      .getVoiceProfiles();
  }else{
    render();
  }
})();
</script>

<script id="canonical-head-title-guard">
(function () {
  'use strict';
  var CANONICAL_HEAD_TITLE = 'HEAD OF CUSTOMER SUPPORT CENTER';
  var LEGACY = /^\s*support\s+manager\s*$/i;

  function fixTextNode(node) {
    if (!node || node.nodeType !== 3) return;
    var parent = node.parentElement;
    if (!parent || /^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA)$/i.test(parent.tagName)) return;
    if (LEGACY.test(String(node.nodeValue || ''))) {
      node.nodeValue = CANONICAL_HEAD_TITLE;
    }
  }

  function fixTree(root) {
    if (!root) return;
    if (root.nodeType === 3) { fixTextNode(root); return; }
    if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var node;
    while ((node = walker.nextNode())) fixTextNode(node);
  }

  function start() {
    fixTree(document.body);
    if (!document.body || !window.MutationObserver) return;
    new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        if (mutation.type === 'characterData') {
          fixTextNode(mutation.target);
          return;
        }
        Array.prototype.forEach.call(mutation.addedNodes || [], fixTree);
      });
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>
<script id="numero-final-compact-controls">
(function(){
  'use strict';
  var AR_KEY='support_center_ar', VOICE_KEY='support_center_voice';

  function get(ids){
    for(var i=0;i<ids.length;i++){
      var el=document.getElementById(ids[i]);
      if(el) return el;
    }
    return null;
  }
  function compact(el){
    if(!el) return;
    el.style.setProperty('min-width','46px','important');
    el.style.setProperty('width','46px','important');
    el.style.setProperty('height','38px','important');
    el.style.setProperty('padding','0','important');
    el.style.setProperty('font-size','18px','important');
    el.style.setProperty('letter-spacing','0','important');
    el.style.setProperty('display','inline-flex','important');
    el.style.setProperty('align-items','center','important');
    el.style.setProperty('justify-content','center','important');
  }
  function pref(key, fallback){
    try{ var v=localStorage.getItem(key); return v===null?fallback:v==='1'; }
    catch(e){ return fallback; }
  }
  function infer(text, key, fallback){
    text=String(text||'').toUpperCase();
    if(/\bOFF\b/.test(text)) return false;
    if(/\bON\b/.test(text)) return true;
    return pref(key,fallback);
  }
  var trIcon='<span aria-hidden="true" style="position:relative;width:25px;height:22px;display:inline-block;pointer-events:none">'+
    '<span style="position:absolute;right:0;top:1px;width:16px;height:17px;border-radius:3px;background:#eef1f4;border:1px solid #bcc5ce;display:flex;align-items:center;justify-content:center;color:#4d5964;font:700 10px Arial;line-height:1">文</span>'+
    '<span style="position:absolute;left:0;bottom:0;width:17px;height:17px;border-radius:3px;background:#4285f4;display:flex;align-items:center;justify-content:center;color:#fff;font:700 10px Arial;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.18)">G</span>'+
    '</span>';

  function sync(){
    var ar=get(['arBtn','arabicToggle','tourArabicToggle']);
    var voice=get(['voiceBtn','voiceToggle','tourVoiceToggle']);
    var pause=get(['pauseBtn','pauseToggle','tourPauseToggle']);

    if(ar){
      var raw=ar.getAttribute('data-numero-last-native') || ar.textContent;
      if(/\b(?:AR\s+)?(?:ON|OFF)\b/i.test(ar.textContent||'')){
        raw=ar.textContent; ar.setAttribute('data-numero-last-native',raw);
      }
      var on=infer(raw,AR_KEY,true);
      compact(ar);
      if(ar.innerHTML!==trIcon) ar.innerHTML=trIcon;
      ar.title=on?'Arabic translation: ON':'Arabic translation: OFF';
      ar.setAttribute('aria-label',ar.title);
      ar.style.setProperty('background',on?'#ffffff':'rgba(9,17,23,.78)','important');
      ar.style.setProperty('border-color',on?'#ffffff':'rgba(255,255,255,.18)','important');
      ar.style.setProperty('opacity',on?'1':'.65','important');
    }

    if(voice){
      var vraw=voice.getAttribute('data-numero-last-native') || voice.textContent;
      if(/\bVOICE\s+(?:ON|OFF)\b/i.test(voice.textContent||'')){
        vraw=voice.textContent; voice.setAttribute('data-numero-last-native',vraw);
      }
      var von=infer(vraw,VOICE_KEY,true);
      compact(voice);
      var ico=von?'🔊':'🔇';
      if(voice.textContent!==ico) voice.textContent=ico;
      voice.title=von?'Sound: ON':'Sound: MUTED';
      voice.setAttribute('aria-label',voice.title);
      voice.style.setProperty('background',von?'rgba(9,17,23,.78)':'#b42318','important');
      voice.style.setProperty('border-color',von?'rgba(255,255,255,.18)':'#ff6b5f','important');
      voice.style.setProperty('color','#fff','important');
    }

    if(pause){
      var praw=pause.getAttribute('data-numero-last-native') || pause.textContent;
      if(/PAUSE|PLAY|REPLAY/i.test(pause.textContent||'')){
        praw=pause.textContent; pause.setAttribute('data-numero-last-native',praw);
      }
      compact(pause);
      var picon=/PLAY/i.test(praw)?'▶️':(/REPLAY/i.test(praw)?'↻':'⏸️');
      if(pause.textContent!==picon) pause.textContent=picon;
      pause.title=picon==='▶️'?'Play':(picon==='↻'?'Replay':'Pause');
      pause.setAttribute('aria-label',pause.title);
    }
  }

  function install(){
    sync();
    document.addEventListener('click',function(e){
      var id=(e.target&&e.target.id)||'';
      if(/^(arBtn|arabicToggle|tourArabicToggle|voiceBtn|voiceToggle|tourVoiceToggle|pauseBtn|pauseToggle|tourPauseToggle)$/.test(id)){
        setTimeout(sync,80);
        setTimeout(sync,250);
      }
    },true);
    setInterval(sync,700);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true});
  else install();
})();
</script>
<script id="numero-icon-controls-v3">
(function(){
  'use strict';
  var AR_IDS=['arBtn','arabicToggle','tourArabicToggle'];
  var VOICE_IDS=['voiceBtn','voiceToggle','tourVoiceToggle'];
  var PAUSE_IDS=['pauseBtn','pauseToggle','tourPauseToggle'];

  function firstByIds(ids){
    for(var i=0;i<ids.length;i++){
      var el=document.getElementById(ids[i]);
      if(el) return el;
    }
    return null;
  }

  function forceBaseStyle(btn){
    if(!btn) return;
    btn.style.setProperty('width','46px','important');
    btn.style.setProperty('min-width','46px','important');
    btn.style.setProperty('height','38px','important');
    btn.style.setProperty('padding','0','important');
    btn.style.setProperty('display','inline-flex','important');
    btn.style.setProperty('align-items','center','important');
    btn.style.setProperty('justify-content','center','important');
    btn.style.setProperty('font-size','18px','important');
    btn.style.setProperty('letter-spacing','0','important');
    btn.style.setProperty('line-height','1','important');
  }

  var translateIcon =
    '<span class="numero-translate-icon" aria-hidden="true" style="position:relative;width:25px;height:22px;display:inline-block;pointer-events:none">' +
      '<span style="position:absolute;right:0;top:1px;width:16px;height:17px;border-radius:3px;background:#eef1f4;border:1px solid #bcc5ce;display:flex;align-items:center;justify-content:center;color:#4d5964;font:700 10px Arial;line-height:1">文</span>' +
      '<span style="position:absolute;left:0;bottom:0;width:17px;height:17px;border-radius:3px;background:#4285f4;display:flex;align-items:center;justify-content:center;color:#fff;font:700 10px Arial;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.18)">G</span>' +
    '</span>';

  function decorateArabic(){
    var b=firstByIds(AR_IDS); if(!b) return;
    var raw=(b.textContent||'').trim().toUpperCase();
    if(raw.indexOf('AR ON')>=0) b.dataset.numeroAr='on';
    else if(raw.indexOf('AR OFF')>=0) b.dataset.numeroAr='off';
    if(!b.dataset.numeroAr) b.dataset.numeroAr=(b.classList.contains('active')||b.classList.contains('on'))?'on':'off';
    forceBaseStyle(b);
    if(!b.querySelector('.numero-translate-icon')) b.innerHTML=translateIcon;
    var on=b.dataset.numeroAr==='on';
    b.title=on?'Arabic translation: ON':'Arabic translation: OFF';
    b.setAttribute('aria-label',b.title);
    b.style.setProperty('background',on?'#ffffff':'rgba(9,17,23,.76)','important');
    b.style.setProperty('border-color',on?'#ffffff':'rgba(255,255,255,.18)','important');
    b.style.setProperty('opacity',on?'1':'.62','important');
  }

  function decorateVoice(){
    var b=firstByIds(VOICE_IDS); if(!b) return;
    var raw=(b.textContent||'').trim().toUpperCase();
    if(raw.indexOf('VOICE ON')>=0 || raw==='🔊') b.dataset.numeroMuted='0';
    else if(raw.indexOf('VOICE OFF')>=0 || raw==='🔇') b.dataset.numeroMuted='1';
    if(!b.dataset.numeroMuted) b.dataset.numeroMuted=(b.classList.contains('active')||b.classList.contains('on'))?'0':'1';
    forceBaseStyle(b);
    var muted=b.dataset.numeroMuted==='1';
    var icon=muted?'🔇':'🔊';
    if(b.textContent!==icon) b.textContent=icon;
    b.title=muted?'Audio muted':'Audio on';
    b.setAttribute('aria-label',b.title);
    b.style.setProperty('background',muted?'#c62828':'rgba(9,17,23,.82)','important');
    b.style.setProperty('border-color',muted?'#ff6b6b':'rgba(255,255,255,.18)','important');
    b.style.setProperty('color','#ffffff','important');
  }

  function decoratePause(){
    var b=firstByIds(PAUSE_IDS); if(!b) return;
    var raw=(b.textContent||'').trim().toUpperCase();
    if(raw.indexOf('REPLAY')>=0 || raw==='↻') b.dataset.numeroAction='replay';
    else if(raw.indexOf('PLAY')>=0 || raw==='▶' || raw==='▶️') b.dataset.numeroAction='play';
    else if(raw.indexOf('PAUSE')>=0 || raw==='⏸' || raw==='⏸️') b.dataset.numeroAction='pause';
    if(!b.dataset.numeroAction) b.dataset.numeroAction='pause';
    forceBaseStyle(b);
    var action=b.dataset.numeroAction;
    var icon=action==='play'?'▶':(action==='replay'?'↻':'⏸');
    if(b.textContent!==icon) b.textContent=icon;
    b.title=action==='play'?'Play':(action==='replay'?'Replay':'Pause');
    b.setAttribute('aria-label',b.title);
  }

  var queued=false;
  function decorateAll(){ queued=false; decorateArabic(); decorateVoice(); decoratePause(); }
  function queueDecorate(){ if(queued) return; queued=true; Promise.resolve().then(decorateAll); }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',decorateAll,{once:true});
  else decorateAll();

  var obs=new MutationObserver(function(mutations){
    for(var i=0;i<mutations.length;i++){
      var t=mutations[i].target;
      if(t && t.nodeType===3) t=t.parentElement;
      if(!t) continue;
      var btn=(t.tagName==='BUTTON')?t:(t.closest?t.closest('button'):null);
      var id=btn?btn.id:'';
      if(AR_IDS.indexOf(id)>=0 || VOICE_IDS.indexOf(id)>=0 || PAUSE_IDS.indexOf(id)>=0){ queueDecorate(); return; }
    }
  });
  if(document.body) obs.observe(document.body,{subtree:true,childList:true,characterData:true});
})();
</script>
