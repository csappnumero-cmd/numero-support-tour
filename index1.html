<script id="numero-self-refresh-cache-guard">
(function(){
  'use strict';

  var BUILD_KEY = 'numero_support_build_version';
  var VERSION_FILE = 'build-version.txt';

  function forceFreshHtml(serverBuild){
    try {
      var current = new URL(window.location.href);
      if (current.searchParams.get('__build') === serverBuild) return;
      current.searchParams.set('__build', serverBuild);
      current.searchParams.set('__fresh', String(Date.now()));
      window.location.replace(current.toString());
    } catch(e) {
      var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
      window.location.replace(window.location.href + sep + '__build=' +
        encodeURIComponent(serverBuild) + '&__fresh=' + Date.now());
    }
  }

  function checkBuild(){
    fetch(VERSION_FILE + '?t=' + Date.now(), {
      cache: 'no-store',
      headers: {'Cache-Control':'no-cache'}
    })
    .then(function(r){
      if(!r.ok) throw new Error('version fetch failed');
      return r.text();
    })
    .then(function(v){
      var serverBuild = String(v || '').trim();
      if(!serverBuild) return;

      var stored = '';
      try { stored = localStorage.getItem(BUILD_KEY) || ''; } catch(e) {}

      if(stored !== serverBuild){
        try { localStorage.setItem(BUILD_KEY, serverBuild); } catch(e) {}
        forceFreshHtml(serverBuild);
      }
    })
    .catch(function(){});
  }

  checkBuild();
})();
</script>

    /* =========================
       OFFICE SCENE
    ========================== */

    .office-scene {
      position: relative;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #111;
    }

    .office-bg {
      position: absolute;

      inset: -4%;

      background-image:
        linear-gradient(
          rgba(0,0,0,0.08),
          rgba(0,0,0,0.14)
        ),
        url('assets/images/XBOBxjJ.png');

      background-size: cover;
      background-position: center center;

      transform: scale(1.08);

      animation:
        enterOffice
        6s
        cubic-bezier(.2,.7,.2,1)
        forwards;
    }

    .office-bg::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at center,
          transparent 45%,
          rgba(0,0,0,0.34) 100%
        );
    }

    .cinema-shadow {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.18),
          transparent 25%,
          transparent 70%,
          rgba(0,0,0,0.28)
        );

      pointer-events: none;
    }

    /* =========================
       INTRO TEXT
    ========================== */

    .intro-label {
      position: absolute;

      left: 6%;
      bottom: 8%;

      color: white;

      opacity: 0;

      animation:
        labelIn 1.2s ease 1.4s forwards,
        labelOut 1s ease 4.5s forwards;
    }

    .intro-small {
      margin-bottom: 10px;

      color:
        rgba(255,255,255,0.70);

      font-size: 12px;

      letter-spacing: 4px;

      text-transform: uppercase;
    }

    .intro-title {
      font-size:
        clamp(
          34px,
          4vw,
          64px
        );

      font-weight: 600;

      letter-spacing: 1px;

      text-shadow:
        0 8px 25px
        rgba(0,0,0,0.45);
    }

    /* =========================
       TRANSITION
    ========================== */

    .transition-cover {
      position: fixed;

      inset: 0;

      z-index: 9999;

      opacity: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          rgba(30,24,18,0.95),
          rgba(5,5,5,1) 75%
        );

      transition:
        opacity 0.8s ease;
    }

    .transition-cover.active {
      opacity: 1;
    }

    /* =========================
       PLAY / PAUSE CONTROL
    ========================== */

    .presentation-control {
      position: fixed;

      right: 24px;
      bottom: 22px;

      z-index: 20000;

      display: flex;
      align-items: center;

      gap: 10px;

      padding:
        10px 14px;

      border-radius: 999px;

      color: white;

      background:
        rgba(15,12,10,0.74);

      border:
        1px solid
        rgba(255,255,255,0.20);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,0.32),
        inset 0 1px 0
        rgba(255,255,255,0.08);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      cursor: pointer;

      user-select: none;

      transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease;
    }

    .presentation-control:hover {
      transform:
        translateY(-2px);

      background:
        rgba(23,18,14,0.90);

      border-color:
        rgba(224,183,120,0.45);
    }

    .presentation-control-icon {
      width: 20px;

      text-align: center;

      font-size: 15px;
    }

    .presentation-control-text {
      font-size: 11px;

      font-weight: 700;

      letter-spacing: 1.5px;
    }

    /*
      لما نعمل Pause
      كل CSS animations توقف
    */

    body.presentation-paused * {
      animation-play-state:
        paused !important;
    }

    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes enterOffice {

      from {
        transform:
          scale(1.08);
      }

      to {
        transform:
          scale(1);
      }

    }

    @keyframes labelIn {

      from {
        opacity: 0;

        transform:

      }

      to {

          translateY(0);
      }

    }

    @keyframes labelOut {

      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }

    }

       RESPONSIVE
    ========================== */

    @media (max-width: 760px) {

      .presentation-control {
        right: 14px;
        bottom: 14px;
      }

      .presentation-control-text {
        display: none;
      }

  <script>

    /* =========================================
       PLAY / PAUSE TIMER ENGINE
    ========================================== */

    let presentationPaused = false;

    const presentationTimers =
      new Set();


    function presentationTimer(
      callback,
      delay
    ) {

      const timer = {

        callback: callback,

        remaining: delay,

        startedAt: Date.now(),

        timeoutId: null

      };


      function runTimer() {

        timer.startedAt =
          Date.now();


        timer.timeoutId =
          window.setTimeout(
            function() {

              presentationTimers
                .delete(timer);


              timer.callback();

            },
            timer.remaining
          );

      }


      timer.run =
        runTimer;


      presentationTimers
        .add(timer);


      if (!presentationPaused) {

        runTimer();

      }


      return timer;

    }


    /* =========================================
       PAUSE
    ========================================== */

    function pausePresentation() {

      if (presentationPaused) {
        return;
      }


      presentationPaused = true;


      document.body
        .classList
        .add(
          'presentation-paused'
        );


      presentationTimers
        .forEach(
          function(timer) {

            if (
              timer.timeoutId !==
              null
            ) {

              window.clearTimeout(
                timer.timeoutId
              );


              const elapsed =
                Date.now() -
                timer.startedAt;


              timer.remaining =
                Math.max(
                  0,
                  timer.remaining -
                  elapsed
                );


              timer.timeoutId =
                null;

            }

          }
        );


      document
        .getElementById(
          'presentationControlIcon'
        )
        .textContent =
          '▶';


      document
        .getElementById(
          'presentationControlText'
        )
        .textContent =
          'PLAY';


      document
        .getElementById(
          'presentationControl'
        )
        .setAttribute(
          'aria-label',
          'Resume presentation'
        );

    }


    /* =========================================
       PLAY
    ========================================== */

    function resumePresentation() {

      if (!presentationPaused) {
        return;
      }


      presentationPaused = false;


      document.body
        .classList
        .remove(
          'presentation-paused'
        );


      presentationTimers
        .forEach(
          function(timer) {

            if (
              timer.timeoutId ===
              null
            ) {

              timer.run();

            }

          }
        );


      document
        .getElementById(
          'presentationControlIcon'
        )
        .textContent =
          '⏸';


      document
        .getElementById(
          'presentationControlText'
        )
        .textContent =
          'PAUSE';


      document
        .getElementById(
          'presentationControl'
        )
        .setAttribute(
          'aria-label',
          'Pause presentation'
        );

    }


    /* =========================================
       BUTTON CLICK
    ========================================== */

    document
      .getElementById(
        'presentationControl'
      )
      .addEventListener(
        'click',
        function() {

          if (
            presentationPaused
          ) {

            resumePresentation();

          }
          else {

            pausePresentation();

          }

        }
      );


    /* =========================================
       LOAD HEAD OF CUSTOMER SUPPORT
    ========================================== */

    function loadManagerScene() {

      const cover =
        document.getElementById(
          'transitionCover'
        );


      cover
        .classList
        .add(
          'active'
        );


      presentationTimer(
        function() {

          google.script.run

            .withSuccessHandler(
              function(html) {

                document.open();

                document.write(
                  html
                );

                document.close();

              }
            )

            .withFailureHandler(
              function(error) {

                console.error(
                  'Manager scene load failed:',
                  error
                );

              }
            )

            .getPage(
              'index2'
            );

        },
        750
      );

    }


    /* =========================================
       TIMELINE

       0 - 6 seconds
       دخول المكتب

       بعدها
       الانتقال لـ Head of Customer Support
    ========================================== */

    presentationTimer(
      function() {

        loadManagerScene();

      },
      6000
    );

  </script>
<script id="final-pause-toggle-4-pages">
(function(){
  'use strict';

  function control(){ return document.getElementById('presentationControl'); }
  function icon(){ return document.getElementById('presentationControlIcon'); }
  function text(){ return document.getElementById('presentationControlText'); }

  function setIconFromPausedState(){
    var c=control(), i=icon(), t=text();
    if(!c) return;

    if(t) t.style.display='none';

    var paused=document.body.classList.contains('presentation-paused');
    var symbol=paused ? '▶' : '⏸';

    if(i) i.textContent=symbol;
    else c.textContent=symbol;

    c.setAttribute('aria-label', paused ? 'Play presentation' : 'Pause presentation');
    c.title=paused ? 'Play' : 'Pause';
  }

  function install(){
    var c=control();
    if(!c || c.getAttribute('data-final-pause-sync')==='1') return;

    c.setAttribute('data-final-pause-sync','1');
    setIconFromPausedState();

    c.addEventListener('click',function(){
      setTimeout(setIconFromPausedState,0);
      setTimeout(setIconFromPausedState,40);
    },false);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',install,{once:true});
  }else{
    install();
  }

  setTimeout(install,100);
  setTimeout(install,500);
})();
</script>

<script id="numero-controls-final-v6-script">
(function(){
  'use strict';
  var AR_IDS=['arabicToggle','arBtn','tourArabicToggle'];
  var VOICE_IDS=['voiceToggle','voiceBtn','tourVoiceToggle'];
  var PAUSE_IDS=['pauseBtn','pauseToggle','tourPauseToggle'];
  var busy=false, queued=false;

  function get(ids){
    for(var i=0;i<ids.length;i++){
      var el=document.getElementById(ids[i]);
      if(el) return el;
    }
    return null;
  }
  function stored(key,fallback){
    try{
      var v=localStorage.getItem(key);
      if(v===null) return fallback;
      return v!=='0';
    }catch(e){ return fallback; }
  }
  function parseOnOff(text){
    var t=String(text||'').toUpperCase();
    if(/\b(?:VOICE\s+)?OFF\b/.test(t)) return false;
    if(/\b(?:VOICE\s+)?ON\b/.test(t)) return true;
    if(/\bAR\s+OFF\b/.test(t)) return false;
    if(/\bAR\s+ON\b/.test(t)) return true;
    return null;
  }
  function makeGlyph(text,kind){
    var s=document.createElement('span');
    s.className='numero-control-glyph '+kind;
    s.setAttribute('aria-hidden','true');
    s.textContent=text;
    return s;
  }
  function setGlyph(btn,text,kind){
    if(!btn) return;
    var child=btn.firstElementChild;
    if(btn.childElementCount===1 && child && child.classList.contains('numero-control-glyph') && child.textContent===text && child.classList.contains(kind)) return;
    btn.replaceChildren(makeGlyph(text,kind));
  }
  function syncArabic(){
    var b=get(AR_IDS); if(!b) return;
    var nativeText=(b.textContent||'').trim();
    var parsed=parseOnOff(nativeText);
    if(parsed!==null) b.dataset.numeroArState=parsed?'1':'0';
    var on=b.dataset.numeroArState ? b.dataset.numeroArState==='1' :
      (b.classList.contains('active')||b.classList.contains('on') ? true : stored('support_center_ar',true));
    b.dataset.numeroArState=on?'1':'0';
    setGlyph(b,'AR','ar');
    b.title=on?'Arabic translation: ON':'Arabic translation: OFF';
    b.setAttribute('aria-label',b.title);
  }
  function syncVoice(){
    var b=get(VOICE_IDS); if(!b) return;
    var nativeText=(b.textContent||'').trim();
    var parsed=parseOnOff(nativeText);
    if(parsed!==null) b.dataset.numeroVoiceState=parsed?'1':'0';
    if(/N\/A/i.test(nativeText)) b.dataset.numeroVoiceState='na';
    var state=b.dataset.numeroVoiceState;
    if(!state){
      if(b.classList.contains('off')) state='0';
      else if(b.classList.contains('active')||b.classList.contains('on')) state='1';
      else state=stored('support_center_voice',true)?'1':'0';
      b.dataset.numeroVoiceState=state;
    }
    var unavailable=state==='na';
    var on=state==='1';
    setGlyph(b,unavailable?'—':(on?'🔊':'🔇'),'voice');
    b.title=unavailable?'Audio unavailable':(on?'Audio on':'Audio muted');
    b.setAttribute('aria-label',b.title);
  }
  function syncPause(){
    var b=get(PAUSE_IDS); if(!b) return;
    var raw=((b.getAttribute('aria-label')||'')+' '+(b.textContent||'')).toUpperCase();
    var action=b.dataset.numeroPauseAction||'';
    if(/REPLAY|RESTART|↻/.test(raw)) action='replay';
    else if(/\bPLAY\b|RESUME|▶/.test(raw)) action='play';
    else if(/PAUSE|⏸/.test(raw)) action='pause';
    if(!action) action='pause';
    b.dataset.numeroPauseAction=action;
    var icon=action==='play'?'▶':(action==='replay'?'↻':'⏸');
    setGlyph(b,icon,'pause');
    b.title=action==='play'?'Play':(action==='replay'?'Replay':'Pause');
    b.setAttribute('aria-label',b.title);
  }
  function syncIndex2Shells(){
    var lang=document.getElementById('languageControl');
    var sound=document.getElementById('soundControl');
    if(lang){lang.style.setProperty('transform','none','important');lang.style.setProperty('transition','none','important');}
    if(sound){sound.style.setProperty('transform','none','important');sound.style.setProperty('transition','none','important');}
  }
  function syncAll(){
    if(busy) return;
    busy=true;
    try{ syncArabic(); syncVoice(); syncPause(); syncIndex2Shells(); }
    finally{ busy=false; }
  }
  function queue(){
    if(queued) return;
    queued=true;
    Promise.resolve().then(function(){queued=false;syncAll();});
  }
  function install(){
    syncAll();
    var obs=new MutationObserver(function(mutations){
      if(busy) return;
      for(var i=0;i<mutations.length;i++){
        var t=mutations[i].target;
        if(t && t.nodeType===3) t=t.parentElement;
        if(!t) continue;
        var btn=(t.tagName==='BUTTON')?t:(t.closest?t.closest('button'):null);
        if(!btn) continue;
        var id=btn.id||'';
        if(AR_IDS.indexOf(id)>=0 || VOICE_IDS.indexOf(id)>=0 || PAUSE_IDS.indexOf(id)>=0 || id==='languageControl' || id==='soundControl'){
          queue(); return;
        }
      }
    });
    if(document.body) obs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','aria-label']});
    document.addEventListener('click',function(e){
      var b=e.target&&e.target.closest?e.target.closest('button'):null;
      if(!b) return;
      var id=b.id||'';
      if(AR_IDS.indexOf(id)>=0 || VOICE_IDS.indexOf(id)>=0 || PAUSE_IDS.indexOf(id)>=0 || id==='languageControl' || id==='soundControl'){
        setTimeout(syncAll,0); setTimeout(syncAll,60); setTimeout(syncAll,180);
      }
    },false);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true});
  else install();
})();
</script>
