<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="stylesheet" href="tour-runtime.css">
  <script src="tour-data.js"></script>
  <script src="tour-runtime.js"></script>
  
  <!-- FIXED_TOUR_AUDIO -->
  <script src="tour-audio-map.js"></script>
  <script src="tour-audio.js"></script>
<meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Support Team - Inside</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       OFFICE SCENE
    ========================== */

    .office-scene {
      position: relative;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #111;
    }

    .office-bg {
      position: absolute;

      inset: -4%;

      background-image:
        linear-gradient(
          rgba(0,0,0,0.08),
          rgba(0,0,0,0.14)
        ),
        url('assets/images/XBOBxjJ.png');

      background-size: cover;
      background-position: center center;

      transform: scale(1.08);

      animation:
        enterOffice
        6s
        cubic-bezier(.2,.7,.2,1)
        forwards;
    }

    .office-bg::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at center,
          transparent 45%,
          rgba(0,0,0,0.34) 100%
        );
    }

    .cinema-shadow {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.18),
          transparent 25%,
          transparent 70%,
          rgba(0,0,0,0.28)
        );

      pointer-events: none;
    }

    /* =========================
       INTRO TEXT
    ========================== */

    .intro-label {
      position: absolute;

      left: 6%;
      bottom: 8%;

      color: white;

      opacity: 0;

      animation:
        labelIn 1.2s ease 1.4s forwards,
        labelOut 1s ease 4.5s forwards;
    }

    .intro-small {
      margin-bottom: 10px;

      color:
        rgba(255,255,255,0.70);

      font-size: 12px;

      letter-spacing: 4px;

      text-transform: uppercase;
    }

    .intro-title {
      font-size:
        clamp(
          34px,
          4vw,
          64px
        );

      font-weight: 600;

      letter-spacing: 1px;

      text-shadow:
        0 8px 25px
        rgba(0,0,0,0.45);
    }

    /* =========================
       TRANSITION
    ========================== */

    .transition-cover {
      position: fixed;

      inset: 0;

      z-index: 9999;

      opacity: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          rgba(30,24,18,0.95),
          rgba(5,5,5,1) 75%
        );

      transition:
        opacity 0.8s ease;
    }

    .transition-cover.active {
      opacity: 1;
    }

    /* =========================
       PLAY / PAUSE CONTROL
    ========================== */

    .presentation-control {
      position: fixed;

      right: 24px;
      bottom: 22px;

      z-index: 20000;

      display: flex;
      align-items: center;

      gap: 10px;

      padding:
        10px 14px;

      border-radius: 999px;

      color: white;

      background:
        rgba(15,12,10,0.74);

      border:
        1px solid
        rgba(255,255,255,0.20);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,0.32),
        inset 0 1px 0
        rgba(255,255,255,0.08);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      cursor: pointer;

      user-select: none;

      transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease;
    }

    .presentation-control:hover {
      transform:
        translateY(-2px);

      background:
        rgba(23,18,14,0.90);

      border-color:
        rgba(224,183,120,0.45);
    }

    .presentation-control-icon {
      width: 20px;

      text-align: center;

      font-size: 15px;
    }

    .presentation-control-text {
      font-size: 11px;

      font-weight: 700;

      letter-spacing: 1.5px;
    }

    /*
      لما نعمل Pause
      كل CSS animations توقف
    */

    body.presentation-paused * {
      animation-play-state:
        paused !important;
    }

    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes enterOffice {

      from {
        transform:
          scale(1.08);
      }

      to {
        transform:
          scale(1);
      }

    }

    @keyframes labelIn {

      from {
        opacity: 0;

        transform:
          translateY(15px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }

    @keyframes labelOut {

      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }

    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 760px) {

      .presentation-control {
        right: 14px;
        bottom: 14px;
      }

      .presentation-control-text {
        display: none;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       OFFICE
  ========================== -->

  <main class="office-scene">

    <div class="office-bg"></div>

    <div class="cinema-shadow"></div>

    <div class="intro-label">

      <div class="intro-small">
        Inside the team
      </div>

      <div class="intro-title">
        Support Operations
      </div>

    </div>

  </main>


  <!-- =========================
       PLAY / PAUSE
  ========================== -->

  <button
    id="presentationControl"
    class="presentation-control"
    type="button"
    aria-label="Pause presentation"
  >

    <span
      id="presentationControlIcon"
      class="presentation-control-icon"
    >
      ⏸
    </span>

    <span
      id="presentationControlText"
      class="presentation-control-text"
    >
      PAUSE
    </span>

  </button>


  <!-- =========================
       TRANSITION
  ========================== -->

  <div
    id="transitionCover"
    class="transition-cover"
  ></div>


  <script>

    /* =========================================
       PLAY / PAUSE TIMER ENGINE
    ========================================== */

    let presentationPaused = false;

    const presentationTimers =
      new Set();


    function presentationTimer(
      callback,
      delay
    ) {

      const timer = {

        callback: callback,

        remaining: delay,

        startedAt: Date.now(),

        timeoutId: null

      };


      function runTimer() {

        timer.startedAt =
          Date.now();


        timer.timeoutId =
          window.setTimeout(
            function() {

              presentationTimers
                .delete(timer);


              timer.callback();

            },
            timer.remaining
          );

      }


      timer.run =
        runTimer;


      presentationTimers
        .add(timer);


      if (!presentationPaused) {

        runTimer();

      }


      return timer;

    }


    /* =========================================
       PAUSE
    ========================================== */

    function pausePresentation() {

      if (presentationPaused) {
        return;
      }


      presentationPaused = true;


      document.body
        .classList
        .add(
          'presentation-paused'
        );


      presentationTimers
        .forEach(
          function(timer) {

            if (
              timer.timeoutId !==
              null
            ) {

              window.clearTimeout(
                timer.timeoutId
              );


              const elapsed =
                Date.now() -
                timer.startedAt;


              timer.remaining =
                Math.max(
                  0,
                  timer.remaining -
                  elapsed
                );


              timer.timeoutId =
                null;

            }

          }
        );


      document
        .getElementById(
          'presentationControlIcon'
        )
        .textContent =
          '▶';


      document
        .getElementById(
          'presentationControlText'
        )
        .textContent =
          'PLAY';


      document
        .getElementById(
          'presentationControl'
        )
        .setAttribute(
          'aria-label',
          'Resume presentation'
        );

    }


    /* =========================================
       PLAY
    ========================================== */

    function resumePresentation() {

      if (!presentationPaused) {
        return;
      }


      presentationPaused = false;


      document.body
        .classList
        .remove(
          'presentation-paused'
        );


      presentationTimers
        .forEach(
          function(timer) {

            if (
              timer.timeoutId ===
              null
            ) {

              timer.run();

            }

          }
        );


      document
        .getElementById(
          'presentationControlIcon'
        )
        .textContent =
          '⏸';


      document
        .getElementById(
          'presentationControlText'
        )
        .textContent =
          'PAUSE';


      document
        .getElementById(
          'presentationControl'
        )
        .setAttribute(
          'aria-label',
          'Pause presentation'
        );

    }


    /* =========================================
       BUTTON CLICK
    ========================================== */

    document
      .getElementById(
        'presentationControl'
      )
      .addEventListener(
        'click',
        function() {

          if (
            presentationPaused
          ) {

            resumePresentation();

          }
          else {

            pausePresentation();

          }

        }
      );


    /* =========================================
       LOAD HEAD OF CUSTOMER SUPPORT
    ========================================== */

    function loadManagerScene() {

      const cover =
        document.getElementById(
          'transitionCover'
        );


      cover
        .classList
        .add(
          'active'
        );


      presentationTimer(
        function() {

          google.script.run

            .withSuccessHandler(
              function(html) {

                document.open();

                document.write(
                  html
                );

                document.close();

              }
            )

            .withFailureHandler(
              function(error) {

                console.error(
                  'Manager scene load failed:',
                  error
                );

              }
            )

            .getPage(
              'index2'
            );

        },
        750
      );

    }


    /* =========================================
       TIMELINE

       0 - 6 seconds
       دخول المكتب

       بعدها
       الانتقال لـ Head of Customer Support
    ========================================== */

    presentationTimer(
      function() {

        loadManagerScene();

      },
      6000
    );

  </script>

</body>
</html>
