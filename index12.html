<script id="numero-self-refresh-cache-guard">
(function(){
  'use strict';

  var BUILD_KEY = 'numero_support_build_version';
  var VERSION_FILE = 'build-version.txt';

  function forceFreshHtml(serverBuild){
    try {
      var current = new URL(window.location.href);
      if (current.searchParams.get('__build') === serverBuild) return;
      current.searchParams.set('__build', serverBuild);
      current.searchParams.set('__fresh', String(Date.now()));
      window.location.replace(current.toString());
    } catch(e) {
      var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
      window.location.replace(window.location.href + sep + '__build=' +
        encodeURIComponent(serverBuild) + '&__fresh=' + Date.now());
    }
  }

  function checkBuild(){
    fetch(VERSION_FILE + '?t=' + Date.now(), {
      cache: 'no-store',
      headers: {'Cache-Control':'no-cache'}
    })
    .then(function(r){
      if(!r.ok) throw new Error('version fetch failed');
      return r.text();
    })
    .then(function(v){
      var serverBuild = String(v || '').trim();
      if(!serverBuild) return;

      var stored = '';
      try { stored = localStorage.getItem(BUILD_KEY) || ''; } catch(e) {}

      if(stored !== serverBuild){
        try { localStorage.setItem(BUILD_KEY, serverBuild); } catch(e) {}
        forceFreshHtml(serverBuild);
      }
    })
    .catch(function(){});
  }

  checkBuild();
})();
</script>

  function safeGet(key,fallback){

    if('speechSynthesis' in window){

    }

      state.voices=window.speechSynthesis.getVoices()||[];

  function speakerTitle(key){
    if(String(key||'').toLowerCase()==='support_manager') return 'HEAD OF CUSTOMER SUPPORT CENTER';
    const found=state.profiles.find(profile =>
      String(profile.speaker_key||'').toLowerCase()===String(key||'').toLowerCase()
    );

    if(found && found.title){
      return String(found.title).toUpperCase();
    }

    if(isVisitorKey(key)) return 'VISITOR';

    const map={
      support_manager:'HEAD OF CUSTOMER SUPPORT CENTER',
      assistant_head:'ASSISTANT HEAD OF CUSTOMER SUPPORT CENTER',
      ai_employee:'AI DEVELOPMENT EMPLOYEE'
    };

    return map[key]||String(key||'SYSTEM').replaceAll('_',' ').toUpperCase();
  }

  function getProfile(key){
    const found=state.profiles.find(profile =>
      String(profile.speaker_key||'').toLowerCase()===String(key||'').toLowerCase()
    );

    if(found) return found;

    if(key==='ai_employee'){
      return {
        speaker_key:'ai_employee',
        title:'AI DEVELOPMENT EMPLOYEE',
        gender:'male',
        lang:'en-US',
        voice_hint:'',
        rate:.98,
        pitch:1.01
      };
    }

    return {
      speaker_key:key,
      title:speakerTitle(key),
      gender:isVisitorKey(key)
        ? (String(key).indexOf('male_')>=0?'male':'female')
        : 'male',
      lang:'en-US',
      voice_hint:'',
      rate:isVisitorKey(key)?1.00:.96,
      pitch:isVisitorKey(key)?1.03:.97
    };
  }

  function chooseVoice(profile) {
    const voices = state.voices.length
      ? state.voices
      : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);

    if (!voices.length) return null;

    const hint = String(profile.voice_hint || '').trim().toLowerCase();

    if (hint) {
      const hinted = voices.find(function(voice) {
        return String(voice.name || '').toLowerCase().includes(hint);
      });

      if (hinted) return hinted;
    }

    const managementVoiceKey =
      String(profile.speaker_key || '').toLowerCase();

    if (
      !profile.voice_hint &&
      (
        managementVoiceKey === 'assistant_head' ||
        managementVoiceKey === 'quality_manager'
      )
    ) {
      return chooseVoice(
        Object.assign(
          {},
          profile,
          {
            speaker_key:'support_manager',
            gender:'male',
            voice_hint:''
          }
        )
      );
    }

    const wantedLang = String(profile.lang || 'en-US').toLowerCase();
    const langBase = wantedLang.split('-')[0];

    let pool = voices.filter(function(voice) {
      return String(voice.lang || '').toLowerCase().startsWith(langBase);
    });

    if (!pool.length) pool = voices.slice();

    const femalePattern =
      /samantha|victoria|karen|moira|tessa|zira|aria|jenny|sara|ava|susan|hazel|emma|jane|sonia|libby|female/i;

    const malePattern =
      /daniel|alex|fred|tom|arthur|george|guy|david|mark|ryan|christopher|andrew|brian|eric|roger|stefan|male/i;

    const gender = String(profile.gender || '').toLowerCase();

    const genderPool = pool.filter(function(voice) {
      if (gender === 'female') return femalePattern.test(voice.name || '');
      if (gender === 'male') return malePattern.test(voice.name || '');
      return true;
    });

    if (genderPool.length) {
      pool = genderPool;
    }

    const roleOrder = [
      'visitor',
      'support_manager',
      'assistant_head',
      'quality_manager',
      'quality_team',
      'supervisor',
      'team_leaders',
      'opdc',
      'employees',
      'ai_employee',
      'system'
    ];

    const speakerKey = String(profile.speaker_key || '').toLowerCase();
    let roleIndex = roleOrder.indexOf(speakerKey);

    if (roleIndex < 0) {
      roleIndex = speakerKey
        .split('')
        .reduce(function(total, char) {
          return total + char.charCodeAt(0);
        }, 0);
    }

    return pool[Math.abs(roleIndex) % pool.length] || pool[0] || null;
  }

  function estimate(text){
    text=String(text||'');
    return Math.max(3600,Math.min(11500,text.length*53+1850));
  }

  function splitSpeechText(text,maxLength){
    const words=String(text||'').replace(/\s+/g,' ').trim().split(' ');
    const chunks=[];
    let current='';
    words.forEach(function(word){
      const candidate=current?current+' '+word:word;
      if(candidate.length>maxLength&&current){
        chunks.push(current);
        current=word;
      }else{
        current=candidate;
      }
    });
    if(current) chunks.push(current);
    if (window.supportTourFixedAudio && window.supportTourFixedAudio.usingFixedAudio && typeof text !== 'undefined') { var __fat=String(text||'').replace(/\s+/g,' ').trim(); if(__fat){ chunks.length=0; chunks.push(__fat); } } /* FIXED_AUDIO_NO_SPLIT */
    return chunks;
  }

  function schedule(ms,token){
    clearTimer();
    state.timer=setTimeout(()=>{
      if(!state.paused && token===state.token){
        next();
      }
    },ms);
  }

  function speak(step,token){
    if(!state.voice || state.paused || !('speechSynthesis' in window)){
      schedule(estimate(step.en),token);
      return;
    }

    stopVoice();

    const profile=getProfile(step.speaker);
    const voice=chooseVoice(profile);
    const chunks=splitSpeechText(step.en||'',96);
    let chunkIndex=0;

    function finishSpeech(){
      state.currentUtterance=null;
      if(!state.paused&&token===state.token) schedule(1300,token);
    }

    function speakNextChunk(){
      if(state.paused||token!==state.token) return;
      if(chunkIndex>=chunks.length){
        finishSpeech();
        return;
      }

      const utterance=new SpeechSynthesisUtterance(chunks[chunkIndex++]);
      utterance.lang=profile.lang||'en-US';
      utterance.rate=Number(profile.rate||1);
      utterance.pitch=Number(profile.pitch||1);

      if(voice){
        utterance.voice=voice;
        utterance.lang=voice.lang||utterance.lang;
      }

      state.currentUtterance=utterance;
      let settled=false;

      function finishChunk(){
        if(settled||token!==state.token) return;
        settled=true;
        if(state.currentUtterance===utterance) state.currentUtterance=null;
        if(!state.paused) setTimeout(speakNextChunk,90);
      }

      utterance.onend=finishChunk;
      utterance.onerror=finishChunk;

      try{window.speechSynthesis.speak(utterance);}
      catch(e){finishChunk();}
    }

    speakNextChunk();
  }

  function next(){
    if(state.index<steps.length-1){
      state.index+=1;
      render();
      return;
    }

    state.paused=true;
    updateControls();

    setTimeout(()=>{
      if(
        typeof google!=='undefined' &&
        google.script &&
        google.script.run

          .withSuccessHandler(nextHtml=>{

          .getPage('index13');

  els.voiceBtn.addEventListener('click',()=>{
    state.voice=!state.voice;
    safeSet(VOICE_KEY,state.voice?'1':'0');

    if(!state.voice){
      stopVoice();
      state.token+=1;

      if(!state.paused){
        schedule(4400,state.token);
      }
    }else if(!state.paused){
      render();
    }

    updateControls();
  });

  els.pauseBtn.addEventListener('click',()=>{
    state.paused=!state.paused;

    if(state.paused){
      clearTimer();

      if('speechSynthesis' in window && state.currentUtterance){
        try{window.speechSynthesis.pause();}catch(e){}
      }
    }else{
      if('speechSynthesis' in window && state.currentUtterance){
        try{window.speechSynthesis.resume();}catch(e){}
      }else{
        schedule(850,state.token);
      }
    }

    updateControls();
  });

  function start(){
    render();
  }

  if(
    typeof google!=='undefined' &&
    google.script &&
    google.script.run
  ){
    google.script.run
      .withSuccessHandler(profiles=>{
        state.profiles=Array.isArray(profiles)?profiles:[];
        start();
      })
      .withFailureHandler(()=>{
        state.profiles=[];
        start();
      })
      .getVoiceProfiles();
  }else{
    state.profiles=[];
    start();
  }

})();

<script id="canonical-head-title-guard">
(function () {
  'use strict';
  var CANONICAL_HEAD_TITLE = 'HEAD OF CUSTOMER SUPPORT CENTER';
  var LEGACY = /^\s*support\s+manager\s*$/i;

  function fixTextNode(node) {
    if (!node || node.nodeType !== 3) return;
    var parent = node.parentElement;
    if (!parent || /^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA)$/i.test(parent.tagName)) return;
    if (LEGACY.test(String(node.nodeValue || ''))) {
      node.nodeValue = CANONICAL_HEAD_TITLE;
    }
  }

  function fixTree(root) {
    if (!root) return;
    if (root.nodeType === 3) { fixTextNode(root); return; }
    if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var node;
    while ((node = walker.nextNode())) fixTextNode(node);
  }

  function start() {
    fixTree(document.body);
    if (!document.body || !window.MutationObserver) return;
    new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        if (mutation.type === 'characterData') {
          fixTextNode(mutation.target);
          return;
        }
        Array.prototype.forEach.call(mutation.addedNodes || [], fixTree);
      });
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }
})();
</script>
<script id="numero-final-compact-controls">
(function(){
  'use strict';
  var AR_KEY='support_center_ar', VOICE_KEY='support_center_voice';

  function get(ids){
    for(var i=0;i<ids.length;i++){
      var el=document.getElementById(ids[i]);
      if(el) return el;
    }
    return null;
  }
  function compact(el){
    if(!el) return;
    el.style.setProperty('min-width','46px','important');
    el.style.setProperty('width','46px','important');
    el.style.setProperty('height','38px','important');
    el.style.setProperty('padding','0','important');
    el.style.setProperty('font-size','18px','important');
    el.style.setProperty('letter-spacing','0','important');
    el.style.setProperty('display','inline-flex','important');
    el.style.setProperty('align-items','center','important');
    el.style.setProperty('justify-content','center','important');
  }
  function pref(key, fallback){
    try{ var v=localStorage.getItem(key); return v===null?fallback:v==='1'; }
    catch(e){ return fallback; }
  }
  function infer(text, key, fallback){
    text=String(text||'').toUpperCase();
    if(/\bOFF\b/.test(text)) return false;
    if(/\bON\b/.test(text)) return true;
    return pref(key,fallback);
  }
  var trIcon='<span aria-hidden="true" style="position:relative;width:25px;height:22px;display:inline-block;pointer-events:none">'+
    '<span style="position:absolute;right:0;top:1px;width:16px;height:17px;border-radius:3px;background:#eef1f4;border:1px solid #bcc5ce;display:flex;align-items:center;justify-content:center;color:#4d5964;font:700 10px Arial;line-height:1">文</span>'+
    '<span style="position:absolute;left:0;bottom:0;width:17px;height:17px;border-radius:3px;background:#4285f4;display:flex;align-items:center;justify-content:center;color:#fff;font:700 10px Arial;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.18)">G</span>'+
    '</span>';

  function sync(){
    var ar=get(['arBtn','arabicToggle','tourArabicToggle']);
    var voice=get(['voiceBtn','voiceToggle','tourVoiceToggle']);
    var pause=get(['pauseBtn','pauseToggle','tourPauseToggle']);

    if(ar){
      var raw=ar.getAttribute('data-numero-last-native') || ar.textContent;
      if(/\b(?:AR\s+)?(?:ON|OFF)\b/i.test(ar.textContent||'')){
        raw=ar.textContent; ar.setAttribute('data-numero-last-native',raw);
      }
      var on=infer(raw,AR_KEY,true);
      compact(ar);
      if(ar.innerHTML!==trIcon) ar.innerHTML=trIcon;
      ar.title=on?'Arabic translation: ON':'Arabic translation: OFF';
      ar.setAttribute('aria-label',ar.title);
      ar.style.setProperty('background',on?'#ffffff':'rgba(9,17,23,.78)','important');
      ar.style.setProperty('border-color',on?'#ffffff':'rgba(255,255,255,.18)','important');
      ar.style.setProperty('opacity',on?'1':'.65','important');
    }

    if(voice){
      var vraw=voice.getAttribute('data-numero-last-native') || voice.textContent;
      if(/\bVOICE\s+(?:ON|OFF)\b/i.test(voice.textContent||'')){
        vraw=voice.textContent; voice.setAttribute('data-numero-last-native',vraw);
      }
      var von=infer(vraw,VOICE_KEY,true);
      compact(voice);
      var ico=von?'🔊':'🔇';
      if(voice.textContent!==ico) voice.textContent=ico;
      voice.title=von?'Sound: ON':'Sound: MUTED';
      voice.setAttribute('aria-label',voice.title);
      voice.style.setProperty('background',von?'rgba(9,17,23,.78)':'#b42318','important');
      voice.style.setProperty('border-color',von?'rgba(255,255,255,.18)':'#ff6b5f','important');
      voice.style.setProperty('color','#fff','important');
    }

    if(pause){
      var praw=pause.getAttribute('data-numero-last-native') || pause.textContent;
      if(/PAUSE|PLAY|REPLAY/i.test(pause.textContent||'')){
        praw=pause.textContent; pause.setAttribute('data-numero-last-native',praw);
      }
      compact(pause);
      var picon=/PLAY/i.test(praw)?'▶️':(/REPLAY/i.test(praw)?'↻':'⏸️');
      if(pause.textContent!==picon) pause.textContent=picon;
      pause.title=picon==='▶️'?'Play':(picon==='↻'?'Replay':'Pause');
      pause.setAttribute('aria-label',pause.title);
    }
  }

  function install(){
    sync();
    document.addEventListener('click',function(e){
      var id=(e.target&&e.target.id)||'';
      if(/^(arBtn|arabicToggle|tourArabicToggle|voiceBtn|voiceToggle|tourVoiceToggle|pauseBtn|pauseToggle|tourPauseToggle)$/.test(id)){
        setTimeout(sync,80);
        setTimeout(sync,250);
      }
    },true);
    setInterval(sync,700);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true});
  else install();
})();
</script>
<script id="numero-icon-controls-v3">
(function(){
  'use strict';
  var AR_IDS=['arBtn','arabicToggle','tourArabicToggle'];
  var VOICE_IDS=['voiceBtn','voiceToggle','tourVoiceToggle'];
  var PAUSE_IDS=['pauseBtn','pauseToggle','tourPauseToggle'];

  function firstByIds(ids){
    for(var i=0;i<ids.length;i++){
      var el=document.getElementById(ids[i]);
      if(el) return el;
    }
    return null;
  }

  function forceBaseStyle(btn){
    if(!btn) return;
    btn.style.setProperty('width','46px','important');
    btn.style.setProperty('min-width','46px','important');
    btn.style.setProperty('height','38px','important');
    btn.style.setProperty('padding','0','important');
    btn.style.setProperty('display','inline-flex','important');
    btn.style.setProperty('align-items','center','important');
    btn.style.setProperty('justify-content','center','important');
    btn.style.setProperty('font-size','18px','important');
    btn.style.setProperty('letter-spacing','0','important');
    btn.style.setProperty('line-height','1','important');
  }

  var translateIcon =
    '<span class="numero-translate-icon" aria-hidden="true" style="position:relative;width:25px;height:22px;display:inline-block;pointer-events:none">' +
      '<span style="position:absolute;right:0;top:1px;width:16px;height:17px;border-radius:3px;background:#eef1f4;border:1px solid #bcc5ce;display:flex;align-items:center;justify-content:center;color:#4d5964;font:700 10px Arial;line-height:1">文</span>' +
      '<span style="position:absolute;left:0;bottom:0;width:17px;height:17px;border-radius:3px;background:#4285f4;display:flex;align-items:center;justify-content:center;color:#fff;font:700 10px Arial;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.18)">G</span>' +
    '</span>';

  function decorateArabic(){
    var b=firstByIds(AR_IDS); if(!b) return;
    var raw=(b.textContent||'').trim().toUpperCase();
    if(raw.indexOf('AR ON')>=0) b.dataset.numeroAr='on';
    else if(raw.indexOf('AR OFF')>=0) b.dataset.numeroAr='off';
    if(!b.dataset.numeroAr) b.dataset.numeroAr=(b.classList.contains('active')||b.classList.contains('on'))?'on':'off';
    forceBaseStyle(b);
    if(!b.querySelector('.numero-translate-icon')) b.innerHTML=translateIcon;
    var on=b.dataset.numeroAr==='on';
    b.title=on?'Arabic translation: ON':'Arabic translation: OFF';
    b.setAttribute('aria-label',b.title);
    b.style.setProperty('background',on?'#ffffff':'rgba(9,17,23,.76)','important');
    b.style.setProperty('border-color',on?'#ffffff':'rgba(255,255,255,.18)','important');
    b.style.setProperty('opacity',on?'1':'.62','important');
  }

  function decorateVoice(){
    var b=firstByIds(VOICE_IDS); if(!b) return;
    var raw=(b.textContent||'').trim().toUpperCase();
    if(raw.indexOf('VOICE ON')>=0 || raw==='🔊') b.dataset.numeroMuted='0';
    else if(raw.indexOf('VOICE OFF')>=0 || raw==='🔇') b.dataset.numeroMuted='1';
    if(!b.dataset.numeroMuted) b.dataset.numeroMuted=(b.classList.contains('active')||b.classList.contains('on'))?'0':'1';
    forceBaseStyle(b);
    var muted=b.dataset.numeroMuted==='1';
    var icon=muted?'🔇':'🔊';
    if(b.textContent!==icon) b.textContent=icon;
    b.title=muted?'Audio muted':'Audio on';
    b.setAttribute('aria-label',b.title);
    b.style.setProperty('background',muted?'#c62828':'rgba(9,17,23,.82)','important');
    b.style.setProperty('border-color',muted?'#ff6b6b':'rgba(255,255,255,.18)','important');
    b.style.setProperty('color','#ffffff','important');
  }

  function decoratePause(){
    var b=firstByIds(PAUSE_IDS); if(!b) return;
    var raw=(b.textContent||'').trim().toUpperCase();
    if(raw.indexOf('REPLAY')>=0 || raw==='↻') b.dataset.numeroAction='replay';
    else if(raw.indexOf('PLAY')>=0 || raw==='▶' || raw==='▶️') b.dataset.numeroAction='play';
    else if(raw.indexOf('PAUSE')>=0 || raw==='⏸' || raw==='⏸️') b.dataset.numeroAction='pause';
    if(!b.dataset.numeroAction) b.dataset.numeroAction='pause';
    forceBaseStyle(b);
    var action=b.dataset.numeroAction;
    var icon=action==='play'?'▶':(action==='replay'?'↻':'⏸');
    if(b.textContent!==icon) b.textContent=icon;
    b.title=action==='play'?'Play':(action==='replay'?'Replay':'Pause');
    b.setAttribute('aria-label',b.title);
  }

  var queued=false;
  function decorateAll(){ queued=false; decorateArabic(); decorateVoice(); decoratePause(); }
  function queueDecorate(){ if(queued) return; queued=true; Promise.resolve().then(decorateAll); }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',decorateAll,{once:true});
  else decorateAll();

  var obs=new MutationObserver(function(mutations){
    for(var i=0;i<mutations.length;i++){
      var t=mutations[i].target;
      if(t && t.nodeType===3) t=t.parentElement;
      if(!t) continue;
      var btn=(t.tagName==='BUTTON')?t:(t.closest?t.closest('button'):null);
      var id=btn?btn.id:'';
      if(AR_IDS.indexOf(id)>=0 || VOICE_IDS.indexOf(id)>=0 || PAUSE_IDS.indexOf(id)>=0){ queueDecorate(); return; }
    }
  });
  if(document.body) obs.observe(document.body,{subtree:true,childList:true,characterData:true});
})();
</script>
</body>
